name: Sync Twig docs

on:
  schedule:
    - cron: '17 8 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync generated docs
        run: npm run sync

      - name: Build site
        run: npm run build

      - name: Create sync pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: sync/twig-docs-3.x
          delete-branch: true
          commit-message: Sync Twig 3.x docs
          title: Sync Twig 3.x docs
          body: |
            ## Summary
            - Regenerates the VitePress Markdown docs from `twigphp/Twig@3.x`
            - Updates upstream provenance in `upstream/twig-3.x.json`

            ## Test plan
            - `npm run build`
